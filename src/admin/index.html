<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>rtun admin</title>
<style>
  /* Strong custom curves: the stock CSS easings are too weak to read as
     intentional. Entering elements use ease-out so movement starts immediately. */
  :root {
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --bg: #14161a;
    --paper: #1b1e24;
    --raise: #22262e;
    --ink: #e8eaed;
    --muted: #9aa1ac;
    --line: #2c313a;
    --accent: #6aa9ff;
    --ok: #57d08a;
    --warn: #e8b84b;
    --bad: #f2777a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  code, .mono, input[type=text] { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  header {
    padding: 22px 24px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 14px 22px;
    align-items: baseline;
  }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; font-weight: 600; }
  h1 .role {
    font: 500 11px/1 ui-sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent);
    border-radius: 999px;
    padding: 4px 8px;
    margin-left: 8px;
    vertical-align: 2px;
  }
  .idline { color: var(--muted); font-size: 12px; }
  .idline b { color: var(--ink); font-weight: 500; }

  main { padding: 22px 24px 64px; max-width: 980px; }
  section { margin-bottom: 30px; }
  h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 600;
  }
  .hint { color: var(--muted); font-size: 12.5px; margin: -4px 0 12px; }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: none; }
  .row.head {
    color: var(--muted);
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    background: color-mix(in oklab, var(--paper) 70%, black);
  }
  .grow { flex: 1; min-width: 0; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { padding: 18px 14px; color: var(--muted); font-style: italic; }
  .off { opacity: 0.45; }

  /* Rows animate in only on first paint of a list, and never on a keyboard
     action. Nothing enters from scale(0) — that reads as appearing from nowhere. */
  @keyframes rowIn { from { opacity: 0; transform: translateY(4px); } }
  .anim .row.item { animation: rowIn 220ms var(--ease-out) both; }

  .tag {
    font: 600 10.5px/1 ui-sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 4px 7px;
    border-radius: 5px;
    border: 1px solid var(--line);
    color: var(--muted);
    flex: none;
  }
  .tag.tcp { color: #8fc7ff; border-color: #2d4a6d; background: #16283c; }
  .tag.udp { color: #d7b0ff; border-color: #4a3a6d; background: #241c3c; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--bad); }
  .dot.warn { background: var(--warn); }

  button {
    font: 500 13px ui-sans-serif;
    color: var(--ink);
    background: var(--raise);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 12px;
    cursor: pointer;
    /* Named properties only, never `all`. */
    transition: transform 140ms var(--ease-out), background-color 140ms ease,
                border-color 140ms ease, opacity 140ms ease;
  }
  @media (hover: hover) and (pointer: fine) {
    button:hover { background: #2a2f38; border-color: #39404c; }
  }
  /* Press feedback: the interface must feel like it heard the click. */
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[disabled] { opacity: 0.5; cursor: not-allowed; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0b1220;
    font-weight: 600;
  }
  @media (hover: hover) and (pointer: fine) {
    button.primary:hover { background: #7fb6ff; border-color: #7fb6ff; }
  }
  button.danger { color: var(--bad); }
  @media (hover: hover) and (pointer: fine) {
    button.danger:hover { background: #3a1f21; border-color: #6d3236; }
  }
  button.ghost { background: transparent; padding: 6px 9px; font-size: 12px; }

  input[type=text], select {
    font-size: 13px;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 9px;
    transition: border-color 140ms ease, box-shadow 140ms ease;
  }
  input[type=text]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 22%, transparent);
  }
  input::placeholder { color: #5f6773; }
  form.add { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); background: color-mix(in oklab, var(--paper) 60%, black); }
  form.add .id { flex: 1; min-width: 260px; }
  form.add .nm { flex: 1; min-width: 130px; }
  form.add .pt { width: 96px; }

  /* Toast: enters and exits from the same edge, so the motion is spatially
     consistent with where it lives. */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    z-index: 50;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    pointer-events: none;
  }
  .toast {
    min-width: 220px;
    max-width: min(520px, 92vw);
    background: var(--raise);
    border: 1px solid var(--line);
    border-left: 3px solid var(--ok);
    border-radius: 8px;
    padding: 10px 14px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    transform: translate(-50%, 0);
    position: relative;
    left: 50%;
    opacity: 1;
    transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out);
  }
  .toast.bad { border-left-color: var(--bad); }
  .toast[data-leaving] { opacity: 0; transform: translate(-50%, 8px); }
  @starting-style { .toast { opacity: 0; transform: translate(-50%, 10px); } }

  .banner {
    background: #3a2a1a;
    border: 1px solid #6d5232;
    color: #f0d9a8;
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 20px;
    font-size: 13px;
  }
  .gate { max-width: 460px; margin: 12vh auto; text-align: center; }
  .gate form { display: flex; gap: 8px; margin-top: 14px; }
  .gate input { flex: 1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* Reduced motion: keep opacity, drop movement. */
  @media (prefers-reduced-motion: reduce) {
    .anim .row.item { animation: none; }
    .toast, button, input, select { transition-duration: 60ms; }
    .toast, .toast[data-leaving] { transform: translate(-50%, 0); }
  }
</style>
</head>
<body>
<div id="app" aria-busy="true"></div>
<div id="toast" aria-live="polite" role="status"></div>

<script>
"use strict";
/* rtun admin panel. No framework and no build step: the binary stays the only
   artifact, and this file is readable by whoever has to audit what can change an
   allowlist. */

const qs = new URLSearchParams(location.search);
const SS_KEY = "rtun.token";
/* The token arrives in the URL because that is what a printed link can carry.
   It is moved into sessionStorage and stripped from the address bar at once, so
   it stops leaking through history, bookmarks and the window title. */
let token = qs.get("t") || sessionStorage.getItem(SS_KEY) || "";
if (qs.get("t")) {
  sessionStorage.setItem(SS_KEY, token);
  history.replaceState(null, "", location.pathname);
}

let state = null;
let firstPaint = true;

const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg, bad = false) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.textContent = msg;
  $("#toast").append(t);
  /* Exit is faster than enter: the user is done reading, the system should get
     out of the way. */
  setTimeout(() => {
    t.dataset.leaving = "1";
    setTimeout(() => t.remove(), 240);
  }, bad ? 5200 : 2600);
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: {
      /* Header auth, not the query string: a cross-origin form cannot set this,
         which is what keeps a random page from editing the allowlist. */
      Authorization: "Bearer " + token,
      ...(body ? { "Content-Type": "application/json" } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data.error || res.status + " " + res.statusText);
  return data;
}

async function refresh() {
  state = await api("GET", "/api/state");
  render();
}

/* One mutation path: act, report, re-read. The server is the only source of
   truth, so the UI never guesses what the new state is. */
async function act(fn, okMsg) {
  try {
    await fn();
    if (okMsg) toast(okMsg);
    await refresh();
  } catch (e) {
    toast(e.message, true);
  }
}

function tokenGate(msg) {
  document.body.innerHTML = `
    <div class="gate">
      <h1>rtun admin</h1>
      <p class="hint">${esc(msg)}</p>
      <form id="g">
        <input type="text" id="tk" placeholder="admin token" autocomplete="off" spellcheck="false" aria-label="admin token">
        <button class="primary" type="submit">Unlock</button>
      </form>
      <p class="hint" style="margin-top:14px">rtun prints the full URL, token included, when it starts.</p>
    </div>`;
  $("#g").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = $("#tk").value.trim();
    if (!v) return;
    sessionStorage.setItem(SS_KEY, v);
    location.replace(location.pathname);
  });
}

const protoTag = (p) => `<span class="tag ${esc(p)}">${esc(p)}</span>`;

function offerRow(o, peerId) {
  const scope = peerId ? { peer: peerId } : {};
  return `<div class="row item ${o.enabled ? "" : "off"}">
    ${protoTag(o.proto)}
    <b class="mono">${o.port}</b>
    <span class="grow ellipsis">${esc(o.name) || '<span style="color:var(--muted)">—</span>'}</span>
    <button class="ghost" data-act="offer-toggle" data-scope='${esc(JSON.stringify(scope))}'
            data-proto="${o.proto}" data-port="${o.port}" data-enabled="${o.enabled}">
      ${o.enabled ? "Disable" : "Enable"}
    </button>
    <button class="ghost danger" data-act="offer-del" data-scope='${esc(JSON.stringify(scope))}'
            data-proto="${o.proto}" data-port="${o.port}">Remove</button>
  </div>`;
}

function addOfferForm(peerId) {
  const scope = peerId ? { peer: peerId } : {};
  return `<form class="add" data-act="offer-add" data-scope='${esc(JSON.stringify(scope))}'>
    <select name="proto" aria-label="protocol"><option>tcp</option><option>udp</option></select>
    <input class="pt" type="text" name="port" placeholder="port" inputmode="numeric" required aria-label="port">
    <input class="nm" type="text" name="name" placeholder="label (optional)" aria-label="label">
    <button class="primary" type="submit">Offer port</button>
  </form>`;
}

function serveView() {
  const shared = state.shared_offers.length
    ? state.shared_offers.map((o) => offerRow(o, null)).join("")
    : `<div class="empty">No shared ports. Peers reach only what their own list grants.</div>`;

  const peers = state.peers.length
    ? state.peers.map((p) => {
        const live = state.live_peers.find((l) => l.id === p.id);
        const dot = live ? `<span class="dot ${live.path === "direct" ? "ok" : "warn"}"
          title="${esc(live.path)}${live.rtt_ms != null ? " · " + live.rtt_ms + "ms" : ""}"></span>`
          : `<span class="dot" title="not connected"></span>`;
        return `<div class="row item ${p.enabled ? "" : "off"}" style="flex-wrap:wrap">
          ${dot}
          <b>${esc(p.name) || "unnamed"}</b>
          <code class="mono" style="color:var(--muted);font-size:12px">${esc(p.short)}</code>
          <span class="grow"></span>
          ${live ? `<span class="tag">${esc(live.path)}</span>` : ""}
          <button class="ghost" data-act="peer-copy" data-id="${esc(p.id)}">Copy ID</button>
          <button class="ghost" data-act="peer-toggle" data-id="${esc(p.id)}" data-enabled="${p.enabled}">
            ${p.enabled ? "Disable" : "Enable"}
          </button>
          <button class="ghost danger" data-act="peer-del" data-id="${esc(p.id)}"
                  data-name="${esc(p.name || p.short)}">Remove</button>
          <div style="flex-basis:100%;margin:8px 0 0 19px">
            <div class="card">
              ${p.offers.length
                ? p.offers.map((o) => offerRow(o, p.id)).join("")
                : `<div class="empty" style="padding:10px 14px">Only the shared ports.</div>`}
              ${addOfferForm(p.id)}
            </div>
          </div>
        </div>`;
      }).join("")
    : `<div class="empty">No peers allowlisted. Nothing can connect.</div>`;

  return `
  <section>
    <h2>Shared ports</h2>
    <p class="hint">Reachable by every enabled peer. A port listed here is offered on this machine's 127.0.0.1.</p>
    <div class="card">${shared}${addOfferForm(null)}</div>
  </section>
  <section>
    <h2>Peers</h2>
    <p class="hint">Only these endpoint IDs may connect. Removing or disabling one closes its live connection immediately.</p>
    <div class="card">${peers}
      <form class="add" data-act="peer-add">
        <input class="id mono" type="text" name="id" placeholder="endpoint id (64 hex characters)"
               autocomplete="off" spellcheck="false" required aria-label="endpoint id">
        <input class="nm" type="text" name="name" placeholder="label, e.g. laptop" aria-label="label">
        <button class="primary" type="submit">Allow peer</button>
      </form>
    </div>
  </section>`;
}

function connectView() {
  const rows = state.bindings.length
    ? state.bindings.map((b) => {
        const rt = b.runtime;
        const cls = !b.enabled ? "" : rt && rt.state === "listening" ? "ok" : rt ? "bad" : "warn";
        const title = !b.enabled ? "disabled" : rt ? (rt.error || rt.state) : "pending";
        return `<div class="row item ${b.enabled ? "" : "off"}">
          <span class="dot ${cls}" title="${esc(title)}"></span>
          ${protoTag(b.proto)}
          <b class="mono">${b.local}</b>
          <span style="color:var(--muted)">→</span>
          <b class="mono">${b.remote}</b>
          <span class="grow ellipsis">${esc(b.name) || ""}</span>
          ${rt && rt.state === "failed" ? `<span class="tag" style="color:var(--bad);border-color:#6d3236">${esc(rt.error)}</span>` : ""}
          <button class="ghost" data-act="bind-toggle" data-proto="${b.proto}" data-local="${b.local}"
                  data-enabled="${b.enabled}">${b.enabled ? "Disable" : "Enable"}</button>
          <button class="ghost danger" data-act="bind-del" data-proto="${b.proto}"
                  data-local="${b.local}">Remove</button>
        </div>`;
      }).join("")
    : `<div class="empty">No local ports bound.</div>`;

  return `
  <section>
    <h2>Local bindings</h2>
    <p class="hint">Each row binds <code>127.0.0.1:local</code> on this machine and forwards it to
      <code>remote</code> on the serving peer. Adding one binds immediately — no restart.</p>
    <div class="card">${rows}
      <form class="add" data-act="bind-add">
        <select name="proto" aria-label="protocol"><option>tcp</option><option>udp</option></select>
        <input class="pt" type="text" name="local" placeholder="local" inputmode="numeric" required aria-label="local port">
        <input class="pt" type="text" name="remote" placeholder="remote" inputmode="numeric" required aria-label="remote port">
        <input class="nm" type="text" name="name" placeholder="label (optional)" aria-label="label">
        <button class="primary" type="submit">Bind port</button>
      </form>
    </div>
  </section>`;
}

function render() {
  const app = $("#app");
  const isServe = state.role === "serve";
  const peersLine = isServe
    ? `${state.live_peers.length} connected`
    : state.live_peers.length ? "connected" : "not connected";

  app.innerHTML = `
    <header>
      <h1>rtun<span class="role">${esc(state.role)}</span></h1>
      <div class="idline">
        this machine <b class="mono" id="myid" title="${esc(state.id)}">${esc(state.id.slice(0, 16))}…</b>
        <button class="ghost" data-act="copy-self">Copy</button>
      </div>
      <span class="grow"></span>
      <div class="idline">${esc(peersLine)} · up ${fmtDur(state.uptime_secs)}</div>
    </header>
    <main class="${firstPaint ? "anim" : ""}">
      ${isServe ? serveView() : connectView()}
      <p class="hint" style="margin-top:26px">
        Changes are written to <code>${esc(state.config_path)}</code> and take effect at once.
      </p>
    </main>`;
  app.removeAttribute("aria-busy");
  /* Stagger is decorative and must never gate interaction; it runs once. */
  if (firstPaint) {
    app.querySelectorAll(".row.item").forEach((r, i) => {
      r.style.animationDelay = Math.min(i * 28, 220) + "ms";
    });
    firstPaint = false;
  }
}

function fmtDur(s) {
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}

function port(v, what) {
  const n = Number(String(v).trim());
  if (!Number.isInteger(n) || n < 1 || n > 65535) throw new Error(what + " port must be 1-65535");
  return n;
}

async function copy(text, what) {
  try {
    await navigator.clipboard.writeText(text);
    toast(what + " copied");
  } catch {
    /* Clipboard needs a secure context; over plain http on a non-loopback host it
       is unavailable, so say so instead of failing silently. */
    toast("Copy needs clipboard permission — select the value manually", true);
  }
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const d = b.dataset;
  const scope = d.scope ? JSON.parse(d.scope) : {};
  const on = d.enabled === "true";

  if (d.act === "copy-self") return void copy(state.id, "Endpoint ID");
  if (d.act === "peer-copy") return void copy(d.id, "Endpoint ID");

  if (d.act === "peer-toggle")
    return void act(() => api("PATCH", "/api/peers", { id: d.id, enabled: !on }),
      on ? "Peer disabled" : "Peer enabled");

  if (d.act === "peer-del") {
    /* Destructive and irreversible from here — the ID would have to be pasted
       again — so it asks. */
    if (!confirm(`Remove ${d.name}?\n\nIts live connection is closed at once and it can no longer connect.`)) return;
    return void act(() => api("DELETE", "/api/peers", { id: d.id }), "Peer removed");
  }

  if (d.act === "offer-toggle")
    return void act(() => api("PATCH", "/api/offers",
      { ...scope, proto: d.proto, port: Number(d.port), enabled: !on }),
      on ? "Port disabled" : "Port enabled");

  if (d.act === "offer-del")
    return void act(() => api("DELETE", "/api/offers",
      { ...scope, proto: d.proto, port: Number(d.port) }), "Port withdrawn");

  if (d.act === "bind-toggle")
    return void act(() => api("PATCH", "/api/bindings",
      { proto: d.proto, local: Number(d.local), enabled: !on }),
      on ? "Binding disabled" : "Binding enabled");

  if (d.act === "bind-del")
    return void act(() => api("DELETE", "/api/bindings",
      { proto: d.proto, local: Number(d.local) }), "Binding removed");
});

document.addEventListener("submit", (e) => {
  const f = e.target.closest("form.add");
  if (!f) return;
  e.preventDefault();
  const fd = new FormData(f);
  const scope = f.dataset.scope ? JSON.parse(f.dataset.scope) : {};
  const btn = $("button[type=submit]", f);

  const run = async (fn, msg) => {
    btn.disabled = true;
    try {
      await fn();
      toast(msg);
      f.reset();
      await refresh();
    } catch (err) {
      toast(err.message, true);
    } finally {
      btn.disabled = false;
    }
  };

  try {
    if (f.dataset.act === "peer-add") {
      const id = String(fd.get("id")).trim();
      if (!/^[0-9a-fA-F]{64}$/.test(id))
        throw new Error("An endpoint ID is 64 hex characters — run `rtun id` on the other machine");
      return void run(() => api("POST", "/api/peers", { id, name: String(fd.get("name")).trim() }),
        "Peer allowed");
    }
    if (f.dataset.act === "offer-add") {
      const body = { ...scope, proto: fd.get("proto"), port: port(fd.get("port"), "Offered"),
        name: String(fd.get("name")).trim() };
      return void run(() => api("POST", "/api/offers", body), "Port offered");
    }
    if (f.dataset.act === "bind-add") {
      const body = { proto: fd.get("proto"), local: port(fd.get("local"), "Local"),
        remote: port(fd.get("remote"), "Remote"), name: String(fd.get("name")).trim() };
      return void run(() => api("POST", "/api/bindings", body), "Port bound");
    }
  } catch (err) {
    toast(err.message, true);
  }
});

/* Polling keeps the live path and bind status honest. 4s is slow enough to be
   invisible and fast enough that a reconnect shows up while you are still
   looking at the page. Skipped while the tab is hidden. */
setInterval(() => {
  if (document.visibilityState === "visible" && state) refresh().catch(() => {});
}, 4000);

(async () => {
  if (!token) return tokenGate("Paste the admin token to continue.");
  try {
    await refresh();
  } catch (e) {
    if (/401|token/i.test(e.message)) {
      sessionStorage.removeItem(SS_KEY);
      return tokenGate("That token was rejected. Paste the one rtun printed.");
    }
    document.body.innerHTML = `<div class="gate"><h1>rtun admin</h1>
      <p class="hint">Could not reach the API: ${esc(e.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
